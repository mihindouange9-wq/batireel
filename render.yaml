# Blueprint Render : site statique construit par Vite, servi par le CDN de Render.
# EN LIGNE depuis le 23 oct. 2026 : https://batireel.onrender.com (service créé par l'API avec ce contenu, voir tools/render-deploy.mjs).
# Un push sur main ne redéploie pas (l'application GitHub de Render n'a pas accès au dépôt) : relancer tools/render-deploy.mjs après chaque mise à jour.
# VITE_WHATSAPP et VITE_CONTACT_EMAIL restent à renseigner (voir README).
services:
  - type: web
    name: batireel
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_SITE_URL
        value: https://batireel.onrender.com
      # Adresse de contact affichée dans le pied de page.
      # Laisser vide tant qu'elle n'est pas fournie : le site l'indique alors honnêtement.
      - key: VITE_CONTACT_EMAIL
        value: ""
      # Numéro WhatsApp qui reçoit les messages du formulaire « Décrire mon projet »
      # (indicatif pays sans « + » ni espaces, par exemple 241XXXXXXXX).
      # Laisser vide tant qu'il n'est pas fourni : le formulaire propose alors de copier le message.
      - key: VITE_WHATSAPP
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Aucun service tiers : scripts, polices et images viennent du domaine lui-même.
      # Les styles en ligne sont nécessaires aux animations (attributs style posés par GSAP).
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests
